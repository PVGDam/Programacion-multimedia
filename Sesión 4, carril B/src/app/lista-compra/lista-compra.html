<div [class.completo]="lista.length == 5">
    <p>Buscador:</p>

<input
  type="text"
  [value]="nuevoArticulo"
  [class.error]="contador > limite"
  (input)="actualizarArticulo($event)"
  (keyup.enter)="anadir()"
>

<button
  (click)="anadir()"
  [disabled]="!puedeAnadir"
>
  Añadir
</button>

<p [class.error]="contador > limite">
  Caracteres: {{ contador }} / {{ limite }}
</p>

<section [class.llena]="lista.length === maximo">
  <h3>Artículos: {{ lista.length }} de {{ maximo }}</h3>

  <p [class.vacia]="lista.length === 0">
    {{ lista.length ? lista.join(' · ') : textoListaVacia }}
  </p>
</section>

<button
  (click)="vaciar($event)"
  [disabled]="lista.length === 0"
>
  Vaciar lista
</button>
<small> Mantén Mayús al pulsar para vaciarla.</small>

</div>
